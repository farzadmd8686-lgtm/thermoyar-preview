<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>آزمایش بانک خطاهای بوتان | ترمویار</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#0d2b4d}*{box-sizing:border-box}body{margin:0;background:#f7f8fa}main{max-width:660px;margin:25px auto;padding:18px}section{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 20px #0001}h1{font-size:23px}p{line-height:2}label{display:block;font-weight:bold;margin:15px 0 8px}select,input,button{font:inherit;width:100%;min-height:48px;border:1px solid #ccd3db;border-radius:10px;padding:9px;background:white}button{background:#0b7935;color:white;border:0;font-weight:bold;margin-top:22px;cursor:pointer}.result{background:#fff3f5;padding:15px;border-radius:13px;margin-top:20px;display:none}.result.show{display:block}.call{display:block;text-align:center;background:#a6002a;color:white;text-decoration:none;padding:15px;border-radius:12px;margin-top:18px;font-weight:bold}.call[aria-disabled=true]{background:#888}.small{font-size:12px;color:#5b6876}.notice{background:#fff1d9;padding:10px;border-radius:10px}</style></head><body><main><section><h1>آزمایش بانک کدهای خطای بوتان</h1><p class="notice">این صفحه فقط برای آزمایش اطلاعات جدید است؛ طراحی تأییدشده ترمویار تغییر نکرده است.</p><label for="model">مدل دستگاه</label><select id="model"><option value="">در حال دریافت اطلاعات...</option></select><label for="code">کد خطا یا وضعیت چراغ</label><select id="code"><option value="">ابتدا مدل را انتخاب کنید</option></select><label for="manual">یا کد را دستی وارد کنید</label><input id="manual" placeholder="مثلاً E01"><button id="search">مشاهده توضیح</button><div id="result" class="result" role="status"></div><p class="small" id="status"></p></section></main><script>
const $=id=>document.getElementById(id),rows=[];const msg='توضیحی برای این کد خطا وجود ندارد.';const safety='برای بررسی دقیق، دستگاه را باز یا دستکاری نکنید و با متخصص تماس بگیرید.';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function options(el,values,placeholder){el.replaceChildren(new Option(placeholder,''));values.forEach(v=>el.add(new Option(v,v)))}function norm(s){return String(s||'').trim().toUpperCase().replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/\s+/g,'')}function hour(){return Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tehran',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).find(p=>p.type==='hour').value)}function callAllowed(){const h=hour();return h>=10&&h<22}function updateCall(){document.querySelectorAll('.call').forEach(a=>{const ok=callAllowed();a.href=ok?'tel:09301116626':'#';a.setAttribute('aria-disabled',String(!ok))})}document.addEventListener('click',e=>{const a=e.target.closest('.call');if(a&&!callAllowed()){e.preventDefault();updateCall();alert('ساعت پاسخ‌گویی ترمویار از ۱۰ تا ۲۲ به وقت تهران است.')}});$('model').addEventListener('change',()=>{const m=$('model').value;options($('code'),[...new Set(rows.filter(r=>r.model===m).map(r=>r.code))],'کد را انتخاب کنید');$('manual').value='';$('result').classList.remove('show')});$('search').addEventListener('click',()=>{const m=$('model').value,c=norm($('manual').value||$('code').value);if(!m||!c){$('result').innerHTML='<p>مدل و کد خطا را انتخاب کنید.</p>';return $('result').classList.add('show')}const r=rows.find(x=>x.model===m&&norm(x.code)===c);$('result').innerHTML='<h2>'+esc(c)+'</h2><p><b>مدل:</b> '+esc(m)+'</p><p>'+(r?esc(r.meaning):msg)+'</p><p>'+safety+'</p><a class="call" href="#">تماس با متخصص</a>'; $('result').classList.add('show');updateCall()});fetch('./data/butan-staging-merged-v1.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{rows.push(...data.additions);options($('model'),[...new Set(rows.map(r=>r.model))].sort(),'مدل دستگاه را انتخاب کنید');$('status').textContent=rows.length+' رکورد جدید در نسخه آزمایشی بارگذاری شد. این آزمایش فقط رکوردهای جدید را نشان می‌دهد.'}).catch(e=>{$('status').textContent='خطا در دریافت بانک اطلاعاتی: '+e.message;options($('model'),[],'بارگذاری ناموفق بود')});setInterval(updateCall,60000);
</script></body></html>
