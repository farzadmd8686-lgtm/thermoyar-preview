name: V64 deployment pipeline rehearsal (no deploy)
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/cloudflare-github-deploy-v64
    paths:
      - '.github/workflows/v64-deploy-rehearsal.yml'
      - 'experiments/lazy-motion-v62/build-release-candidate.py'
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate locked V64 candidate
        run: python experiments/lazy-motion-v62/build-release-candidate.py
      - name: Verify account-scoped Cloudflare token via read-only endpoint (no deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty"
            exit 1
          fi
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/79f2417a0f87c1876c3a87ebaff57608/tokens/verify",
              headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"::error::Cloudflare token verification returned HTTP {exc.code}; no credentials or response body logged")
              raise SystemExit(1)
          except Exception as exc:
              print("::error::Cloudflare token verification request failed: " + type(exc).__name__)
              raise SystemExit(1)
          if not data.get("success") or data.get("result", {}).get("status") != "active":
              print("::error::Cloudflare token is not active or verification failed")
              raise SystemExit(1)
          print("Cloudflare API token is active; no deployment was performed.")
          PY
      - name: Upload verified V64 package (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: thermoyar-v64-github-cloudflare-rehearsal-NOT-DEPLOYED
          path: experiments/lazy-motion-v62/thermoyar-lazy-motion-release-CANDIDATE.zip
          retention-days: 7
