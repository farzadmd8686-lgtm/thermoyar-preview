name: V64 production deploy (manual approval only)
on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type thermoyar-v64-release to confirm the exact production Worker'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: thermoyar-v64-production
  cancel-in-progress: false
jobs:
  build-and-verify:
    if: ${{ inputs.confirm_target == 'thermoyar-v64-release' }}
    runs-on: ubuntu-latest
    environment: thermoyar-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and strictly validate locked V64 candidate
        run: python experiments/lazy-motion-v62/build-release-candidate.py
      - name: Check deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Upload validated package for manual review (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: thermoyar-v64-production-candidate-NOT-DEPLOYED
          path: experiments/lazy-motion-v62/thermoyar-lazy-motion-release-CANDIDATE.zip
          retention-days: 7
